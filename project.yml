name: FocusShield
options:
  bundleIdPrefix: com.focusshield
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts.git
    from: 2.2.3
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 7.0.0

targets:
  # ── macOS App ───────────────────────────────────────────────
  FocusShield-macOS:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources
        excludes:
          - "DNSProxy/**"
          - "iOS/**"
      - path: Platforms/macOS/Assets.xcassets
        type: folder.assetcatalog
    dependencies:
      - package: KeyboardShortcuts
      - package: GRDB
        product: GRDB
      - target: FocusShieldFilterData
        embed: true
    configFiles:
      Release: Platforms/macOS/DeveloperID-App.xcconfig
    settings:
      base:
        PRODUCT_NAME: Focus Shield
        PRODUCT_BUNDLE_IDENTIFIER: com.focusshield.macos
        INFOPLIST_FILE: Platforms/macOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: Platforms/macOS/FocusShield.entitlements
        ENABLE_HARDENED_RUNTIME: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  FocusShieldFilterData:
    type: system-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Extensions/FocusShieldFilterData
      - path: Sources/Shared/NetworkFilterPolicy.swift
    configFiles:
      Release: Platforms/macOS/DeveloperID-Filter.xcconfig
    settings:
      base:
        PRODUCT_NAME: com.focusshield.macos.filter-data
        PRODUCT_BUNDLE_IDENTIFIER: com.focusshield.macos.filter-data
        INFOPLIST_FILE: Platforms/macOS/FocusShieldFilterData-Info.plist
        CODE_SIGN_ENTITLEMENTS: Platforms/macOS/FocusShieldFilterData.entitlements
        ENABLE_HARDENED_RUNTIME: true
        SKIP_INSTALL: NO

  # ── iOS App ─────────────────────────────────────────────────
  FocusShield-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
        excludes:
          - "DNSProxy/**"
          - "iOS/**"
          - "Services/HostsFileService.swift"
          - "Services/AppMonitorService.swift"
          - "FocusShieldApp.swift"
          - "Views/**"
      - path: Sources/iOS
    dependencies:
      - package: KeyboardShortcuts
      - package: GRDB
        product: GRDB
    settings:
      base:
        PRODUCT_NAME: Focus Shield
        PRODUCT_BUNDLE_IDENTIFIER: com.focusshield.ios
        INFOPLIST_FILE: Platforms/iOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: Platforms/iOS/FocusShield.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  FocusShield-macOS:
    build:
      targets:
        FocusShield-macOS: all
    run:
      config: Debug
  FocusShield-iOS:
    build:
      targets:
        FocusShield-iOS: all
    run:
      config: Debug
      simulateLocation: false
